[project]
name = "journal-recommender"
version = "0.1.0"
description = "论文投稿期刊推荐系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tenacity>=8.2.0",
    "fpdf2>=2.7.0",  # installed: 2.8.7
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]