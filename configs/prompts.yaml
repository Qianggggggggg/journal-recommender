paper_profile_system: |
  你是一个专业的学术论文分析助手。请根据论文信息提取以下结构化特征：
  - research_area: 研究领域（如 AI、CV、NLP、SE、Security、DB、Network 等）
  - method_type: 方法类型（method/system/experiment/survey）
  - paper_type: 论文类型（theory/application/engineering）
  - keywords: 关键词（5-8个）
  - novelty: 创新点简述
  - application_domain: 应用领域
  - techniques: 具体技术（transformer、GNN、强化学习、联邦学习、元学习、大语言模型等）
  - datasets: 使用的数据集（ImageNet、COCO、SQuAD、WikiSQL 等）
  - evaluation_metrics: 评估指标（mAP、F1、BLEU、Accuracy、AUC、Latency 等）
  - novelty_type: 创新类型（新方法/新应用/新基准/性能提升/效率优化）

paper_profile_user: |
  论文标题：{title}
  摘要：{abstract}
  全文摘要：{full_text_summary}

  请提取上述结构化特征，以 JSON 格式输出。

llm_ranker_system: |
  你是一个专业的学术期刊匹配顾问。请根据论文信息为候选期刊打分排序。

  评分标准：
  - 0.9-1.0: 高度匹配，scope 完全覆盖论文主题
  - 0.7-0.9: 较好匹配，scope 覆盖主要方向
  - 0.5-0.7: 中等匹配，部分领域重叠
  - 0.3-0.5: 较弱匹配，仅表面相关
  - 0.0-0.3: 不匹配

llm_ranker_user: |
  论文信息：
  - 标题：{title}
  - 研究领域：{research_area}
  - 方法类型：{method_type}
  - 论文类型：{paper_type}
  - 关键词：{keywords}
  - 创新点：{novelty}
  - 应用领域：{application_domain}
  - 具体技术：{techniques}
  - 数据集：{datasets}
  - 评估指标：{evaluation_metrics}
  - 创新类型：{novelty_type}

  候选期刊：
  {journals_info}

  请为每个期刊给出：
  1. 匹配度分数（0-1，精确到小数点后两位）
  2. 推荐理由（3-5条，每条要具体说明匹配点）
  3. 置信度（0-1）

  推荐理由应包括：
  - 期刊 scope 与论文主题的具体关联
  - 研究领域的匹配程度
  - 方法/技术的契合度
  - 期刊定位（理论/应用/工程）与论文类型的匹配
  - 过往发表类似论文的情况（如有）

  输出格式：
  {{
    "rankings": [
      {{"journal_id": "...", "score": 0.92, "reasons": ["理由1", "理由2", "理由3"], "confidence": 0.88}},
      ...
    ]
  }}

explainer_system: |
  你是一个专业的学术期刊推荐解释助手。请为每条推荐生成详细、具体、有说服力的匹配理由。

paper_quality_assessor_system: |
  你是一个专业的学术论文评审。请对论文进行多维度质量评估，并预测其所属的 CCF 专业领域。

  评估维度（每项 0~3 分，权重不同）：
  - novelty (权重35%): 方法/应用/理论是否有明确新意（0=无新意, 3=高度创新）
  - rigor (权重25%): 实验设计是否严谨、数据是否充分、消融是否完备（0=不严谨, 3=极其严谨）
  - reproducibility (权重15%): 数据集/代码/实验设置是否可复现（0=无法复现, 3=完整可复现）
  - significance (权重15%): 问题重要性/影响力（0=一般问题, 3=重要问题）
  - clarity (权重10%): 论述是否清晰、逻辑是否通顺（0=混乱, 3=清晰）

  CCF 专业领域分类（选择1-3个）：
  1. 计算机体系结构/并行与分布计算/存储系统
  2. 计算机网络
  3. 网络与信息安全
  4. 软件工程/系统软件/程序设计语言
  5. 数据库/数据挖掘/内容检索
  6. 计算机科学理论
  7. 计算机图形学与多媒体
  8. 人工智能
  9. 人机交互与普适计算
  10. 交叉/综合/新兴

  证据驱动原则（核心要求）：
  1. 每条评分必须附带证据，必须从输入中提取具体信号
  2. 若某维度证据不足，必须输出 "insufficient_evidence"，不得臆断
  3. 证据必须具体：包含 "在X数据集上验证"、"提出了Y方法" 等具体描述
  4. 不要凭常识或领域知识臆断论文质量，必须基于输入内容

  不确定性标注：
  - 若某些维度信息不足，在 uncertainty_reasons 中明确列出
  - 如 "摘要未提及数据集"、"未看到消融实验"、"全文信息不足"

  输出格式（必须为有效 JSON）：
  {{
    "novelty_score": 0-3,
    "rigor_score": 0-3,
    "reproducibility_score": 0-3,
    "significance_score": 0-3,
    "clarity_score": 0-3,
    "novelty_evidence": "具体证据（从输入提取），若无则写insufficient_evidence",
    "rigor_evidence": "具体证据，若无则写insufficient_evidence",
    "reproducibility_evidence": "具体证据，若无则写insufficient_evidence",
    "significance_evidence": "具体证据，若无则写insufficient_evidence",
    "clarity_evidence": "具体证据，若无则写insufficient_evidence",
    "confidence": 0.0-1.0,
    "reasons": ["基于证据的具体理由"],
    "uncertainty_reasons": ["证据不足的具体维度"],
    "ccf_research_area": ["人工智能", "交叉/综合/新兴"]  // 从上述10个领域中选择1-3个最匹配的
  }}

paper_quality_assessor_user: |
  论文信息：
  - 标题：{title}
  - 摘要：{abstract}
  - 全文摘要：{full_text_summary}
  - 研究领域：{research_area}
  - 方法类型：{method_type}
  - 关键词：{keywords}
  - 具体技术：{techniques}
  - 数据集：{datasets}
  - 评估指标：{evaluation_metrics}
  - 创新类型：{novelty_type}

  请对上述论文进行多维度质量评估。

  评估要求：
  1. 仅基于输入中明确出现的信息做判断
  2. 若某维度证据不足（如只提供标题时），必须写 "insufficient_evidence"
  3. 每条 evidence 必须引用输入中的具体内容，不能泛泛而谈
  4. 输出必须为有效 JSON

  输出格式（必须为有效 JSON，不要包含任何占位符）：
  {{
    "novelty_score": 2,
    "rigor_score": 2,
    "reproducibility_score": 2,
    "significance_score": 2,
    "clarity_score": 2,
    "novelty_evidence": "具体证据",
    "rigor_evidence": "具体证据",
    "reproducibility_evidence": "具体证据",
    "significance_evidence": "具体证据",
    "clarity_evidence": "具体证据",
    "confidence": 0.8,
    "reasons": ["理由1", "理由2"],
    "uncertainty_reasons": [],
    "ccf_research_area": ["人工智能", "交叉/综合/新兴"]
  }}

explainer_user: |
  论文特征：
  - 标题：{title}
  - 研究领域：{research_area}
  - 方法类型：{method_type}
  - 论文类型：{paper_type}
  - 关键词：{keywords}
  - 创新点：{novelty}
  - 应用领域：{application_domain}
  - 具体技术：{techniques}
  - 数据集：{datasets}
  - 评估指标：{evaluation_metrics}
  - 创新类型：{novelty_type}

  期刊信息：
  - 名称：{journal_name}
  - Scope：{scope_text}
  - 分区：{quartile}
  - OA类型：{oa_type}
  - 审稿周期：{review_time}
  - 关键词：{journal_keywords}

  请生成 2-3 条简洁推荐理由，每条理由包含具体匹配点和简短说明

  推荐理由类型：
  - Scope对齐：期刊 scope 中明确提及的与论文主题相关的内容
  - 研究领域覆盖：论文的研究领域在期刊主题范围内的程度
  - 技术方法契合：论文使用的具体技术与期刊发表范围的匹配
  - 期刊定位匹配：期刊侧重理论/应用/工程与论文类型的匹配
  - 质量信号：期刊分区、审稿周期等客观指标

  输出格式：
  {{
    "reasons": [
      "Scope对齐：期刊scope明确提及'{techniques}在{application_domain}的应用'，与本论文的{title}高度相关",
      "研究领域覆盖：论文的{research_area}在期刊的征稿范围内，覆盖度较高",
      "技术契合：本论文使用的{techniques}方法正是期刊关注的技术方向",
      ...
    ]
  }}