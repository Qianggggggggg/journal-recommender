app:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

minimax:
  api_key: "${MINIMAX_API_KEY}"
  base_url: "https://api.minimax.chat"
  model: "MiniMax-M2.7"
  temperature: 0.2

ollama:
  base_url: "http://localhost:11434"
  embedding_model: "qwen3-embedding:4b"
  timeout_seconds: 180

candidate_generator:
  retrieval_target: "typical_abstracts"  # scope_text | typical_abstracts
  weighting_strategy: "fixed"            # fixed | gating
  gating_model_path: "data/models/gating_network.pt"
  fusion_strategy: "weighted_minmax"     # weighted_minmax | rrf | weighted_rrf
  hybrid_scope_weight: 0.65
  hybrid_typical_weight: 0.35
  identity_anchor_weight: 0.10
  accepted_paper_weight: 0.20
  rrf_k: 60
  route_top_k:
    title:
      bm25: 22
      vector: 22
      text: 16
    abstract:
      bm25: 28
      vector: 56
      text: 14
      # P0-1 (2026-06-18): accepted corpus max=15 per journal (avg 9.5).
      # Was 28/56 — copy-paste from scope route; value is meaningless when
      # larger than corpus. Locked by tests/test_route_top_k_config.py.
      accepted_bm25: 15
      accepted_vector: 15
    full:
      bm25: 32
      vector: 32
      text: 16
  merge_weights:
    bm25: 0.45
    vector: 0.35
    text: 0.20

data:
  journal_store_path: "data/processed/journals.jsonl"
  faiss_index_path: "data/processed/journals_index.faiss"
  metadata_path: "data/processed/journals_metadata.parquet"
  typical_abstracts_dir: "data/typical_abstracts"
  typical_abstracts_faiss_path: "data/processed/typical_abstracts_index.faiss"
  typical_abstracts_metadata_path: "data/processed/typical_abstracts_metadata.parquet"
  accepted_papers_dir: "data/accepted_papers"
  accepted_papers_faiss_path: "data/processed/accepted_papers_index.faiss"
  accepted_papers_metadata_path: "data/processed/accepted_papers_metadata.parquet"

ranking:
  strategy: "llm"               # llm | two_tower | two_stage
  llm_ranker_timeout_seconds: 720
  use_two_tower: false          # ablation switch
  use_cross_encoder: false      # ablation switch
  two_tower_model_path: "data/models/two_tower_ranker.pt"
  cross_encoder_model_path: "data/models/cross_ranker.pt"
  # 6.3: Evidence-based role ranker. When evidence_role.enabled=true and
  # snapshot_path points to a valid file, the pipeline uses
  # LLMEvidenceRoleRanker (which reads evidence from the snapshot
  # instead of calling LLM at recommendation time). When enabled but
  # snapshot is missing, falls back to llm_direct.
  llm_direct:
    enabled: true                # fallback when evidence snapshot is missing
  evidence_role:
    enabled: true               # opt-in: turn on to use the new path
    snapshot_path: "data/evaluation/evidence/v2_20260616/holdout240_evidence_20260616_195324.json"
    prior_source: "learned"      # rule | learned (learned needs LTR rerank)
    evidence_weight: 0.55        # v3p baseline winner (e=0.55, p=0.35, l=0.10)
    prior_weight: 0.35           # linear rank prior from LTR
    ltr_score_weight: 0.10       # raw LTR score as 3rd formula component
    prompt_version: "v2"         # PRODUCTION DEFAULT 2026-06-16: v2 prompt (CCF-tier calibration)
    # evidence_field_weights intentionally absent (P0-2 rolled back
    # 2026-06-18, see commit 8384dc2 + tests/test_evidence_field_weights_production.py).
    # Ranker falls back to equal-weight mean of fit_fields. Re-enabling
    # requires a holdout240 ablation that beats 159 baseline.
  llm_anchor_guard:
    enabled: true
    protect_rule_rank: 5
    max_score_gap: 0.08
  rule_scorer:
    scope_boundary_evidence: 0.35
    typical_scope_synergy: 0.08
    typical_only_penalty: 0.08
    retrieval_rank_prior: 1.80
    strong_scope_rank_bonus: 1.00
    strong_typical_rank_bonus: 0.00
    scope_typical_confirm_bonus: 0.60
    multi_route_bonus: 0.40
    research_area_match: 0.50
    ccf_research_area_match: 0.50
  # 5.3 — learned reranker (Task 5.3 baseline). Default OFF.
  # v1 = pure rerank within llm_candidates (no score blend).
  # blend_with_* fields are reserved for 5.4 ablation; not consumed in 5.3.
  learned_reranker:
    enabled: true
    model_path: "data/models/learning_to_ranker_balanced_v4_lr.json"
    blend_with_rule_score: 0.30  # reserved; not consumed by 5.3 v1
    blend_with_llm_score: 0.20   # reserved; not consumed by 5.3 v1

  # P-counterfactual 2026-06-16: experimental ablation flags.
  # Set skip_quality_assessment=true to bypass the LLM quality_assessor
  # call (saves 240 LLM calls per holdout240 run). Tests whether the
  # quality signal is actually doing anything in the final ranking.
  #
  # 2026-06-16 holdout240 counterfactual result:
  #   skip=false: 154/240 (A=60, B=54, C=40)  ← baseline File2
  #   skip=true:  154/240 (A=60, B=54, C=40)  ← 198/240 recs differ, 8 hit outcomes net to 0
  # Conclusion: quality_assessor call is net-zero on aggregate but adds 82% rerank churn.
  # Kept as opt-in for future ablation; default remains false.
  experimental:
    skip_quality_assessment: true
